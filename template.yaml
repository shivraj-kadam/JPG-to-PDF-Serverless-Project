AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless JPG to PDF conversion using S3, Lambda, Pillow and ReportLab

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.13

Resources:
  ImagePdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: S3-Lambda-ImagePDF
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImageBucket
        - S3WritePolicy:
            BucketName: !Ref ImageBucket
      Layers:
        - !Ref PillowLayer
        - !Ref ReportLabLayer
      Events:
        ImageUpload:
          Type: S3
          Properties:
            Bucket: !Ref ImageBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: input/

  ImageBucket:
    Type: AWS::S3::Bucket

  PillowLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: jpg-pdf-pillow
      ContentUri: layer/pillow/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

  ReportLabLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: jpg-pdf-reportlab
      ContentUri: layer/reportlab/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

Outputs:
  ImageBucketName:
    Description: S3 bucket for input images and generated PDFs
    Value: !Ref ImageBucket
  ImagePdfFunction:
    Description: Lambda function ARN
    Value: !GetAtt ImagePdfFunction.Arn
